name: release

# 打 tag（如 v0.2.0）即把仓库里已构建好的安装包挂到 GitHub Release。
# 设计取舍：CI 不重复打包——上传仓库 release/ 里的包，
# 保证「仓库 / Release / 分发渠道」三处字节完全一致（此前 CI 重建导致同版本包相差 11 字节）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # 静态检查拆开跑便于定位失败环节；不阻塞发布（发布物是仓库里已构建好的包）
      - name: Lint
        run: pnpm lint
        continue-on-error: true
      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Generate release notes from CHANGELOG
        run: node scripts/release-body.mjs

      # 只挑当前版本的包上传，避免 history 包混进 Release
      - name: Collect packages for this version
        run: |
          VERSION=$(node -p "require('./mnaddon.json').version")
          echo "version=$VERSION"
          mkdir -p .rel
          cp "release/Euclid Sketch-$VERSION.mnaddon" "release/Euclid Sketch-$VERSION.mntemplate" .rel/

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: .rel/*
          body_path: release-body.md
          overwrite_files: true
