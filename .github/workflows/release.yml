name: release

# 打 tag（如 v0.2.0）即把仓库里已构建好的安装包挂到 GitHub Release。
# 设计取舍：CI 不重复打包——上传仓库 release/ 里的包，
# 保证「仓库 / Release / 分发渠道」三处字节完全一致（此前 CI 重建导致同版本包相差 11 字节）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # 只做静态检查，确认打的 tag 代码是通过检查的
      - run: pnpm check

      - name: Generate release notes from CHANGELOG
        run: node scripts/release-body.mjs

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.mnaddon
            release/*.mntemplate
          body_path: release-body.md
          overwrite_files: true
