name: release

# 打 tag（如 v0.1.0）即自动构建并挂到 GitHub Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm package

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.mnaddon
            release/*.mntemplate
          generate_release_notes: true
