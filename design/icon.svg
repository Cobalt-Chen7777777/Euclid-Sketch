<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!--
    Euclid Sketch · 插件图标

    注意：MarginNote 会把本图当作 alpha 蒙版，只取轮廓、用界面色单色绘制。
    因此必须是「透明底的纯剪影」——不能有背景色块、渐变或半透明，
    图形以外区域全部透明，内部层次只能靠负空间表达。

    设计约束（官方《为插件设置图标》）：
      · 64 网格内四周留白 4–6；描边 3–5；端点与转角圆角
      · 负空间缝隙 ≥2，避免小尺寸抗锯齿粘连；内容 100% 不透明

    构图：圆规立在它刚画出的一段弧上。
         铰链在最上方（实心圆点），两条腿张开落在弧线之上；弧线用较细的描边，
         与腿之间留出 ≥2 的缝隙，44px 下不会糊成一块。
  -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 15 L19.5 43" stroke-width="4.6" />
    <path d="M32 15 L44.5 43" stroke-width="4.6" />
    <path d="M17 45.5 Q32 37.5 47 45.5" stroke-width="3.4" />
    <circle cx="32" cy="11.4" r="3.4" fill="#ffffff" stroke="none" />
  </g>
</svg>
