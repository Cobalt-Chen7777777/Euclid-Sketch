<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 45%, #7c3aed 100%);
    color: #fff; position: relative;
  }
  .glow {
    position: absolute; width: 720px; height: 720px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.16), transparent 65%);
    top: -260px; right: -160px;
  }
  .grid {
    position: absolute; inset: 0; opacity: .12;
    background-image: linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .wrap { position: relative; display: flex; gap: 48px; padding: 64px 64px 0; height: 100%; }
  .left { flex: 1; display: flex; flex-direction: column; }
  .badge {
    width: 72px; height: 72px; border-radius: 20px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.3);
    display: grid; place-items: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.28);
    margin-bottom: 30px;
  }
  h1 { font-size: 58px; font-weight: 800; letter-spacing: -1px; line-height: 1.08; }
  .sub { margin-top: 18px; font-size: 24px; line-height: 1.5; color: rgba(255,255,255,.9); font-weight: 500; }
  .tags { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
  .tag {
    padding: 9px 16px; border-radius: 999px; font-size: 17px; font-weight: 600;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.24);
  }
  .foot {
    margin-top: auto; padding-bottom: 46px;
    font-size: 18px; color: rgba(255,255,255,.78); font-weight: 500;
    display: flex; align-items: center; gap: 10px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
  .right { width: 470px; position: relative; }
  .shot {
    position: absolute; border-radius: 16px; overflow: hidden;
    box-shadow: 0 28px 70px rgba(0,0,0,.42);
    border: 1px solid rgba(255,255,255,.24);
    background: #f7f5f0;
  }
  .shot img { width: 100%; display: block; }
  .s1 { width: 400px; top: 100px; left: 40px; transform: rotate(-3deg); }
  .s2 { width: 320px; top: 290px; left: 130px; transform: rotate(2.5deg); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="left">
      <div class="badge">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="11.5" r="7.5" opacity=".95" />
          <path d="M12 3.2 L17.4 19.6 M12 3.2 L6.6 19.6" />
          <circle cx="12" cy="3.2" r="1.5" fill="#fff" stroke="none" />
        </svg>
      </div>
      <h1>Euclid Sketch</h1>
      <div class="sub">在 MarginNote 里直接画数学图<br />函数 · 几何 · 立体模型，画完直接进卡片</div>
      <div class="tags">
        <span class="tag">函数绘图</span>
        <span class="tag">几何作图</span>
        <span class="tag">立体模型</span>
        <span class="tag">图片入卡</span>
      </div>
      <div class="foot"><span class="dot"></span>MarginNote 5 场景插件 · MIT 开源</div>
    </div>
    <div class="right">
      <div class="shot s1"><img src="../docs/screenshots/canvas.png" alt="" /></div>
      <div class="shot s2"><img src="../docs/screenshots/solid.png" alt="" /></div>
    </div>
  </div>
</body>
</html>
